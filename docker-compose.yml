name: tacit

# Local dev infrastructure. The apps (web, api) run on the host for fast reloads.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tacit}
      # Read by infra/postgres/init/01-roles.sh to create the three app roles.
      TACIT_MIGRATOR_PASSWORD: ${TACIT_MIGRATOR_PASSWORD:-migrator}
      TACIT_AUTH_PASSWORD: ${TACIT_AUTH_PASSWORD:-auth}
      TACIT_API_PASSWORD: ${TACIT_API_PASSWORD:-api}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outgoing email (invites, verification) in dev. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Not used until the graph layer (build step 4). Start with: docker compose --profile graph up
  neo4j:
    image: neo4j:5
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tacit-dev-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
