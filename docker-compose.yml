name: tacit

# Local Neo4j for development, tests and solo use. Teams sharing a graph should use
# Neo4j Aura or deploy/neo4j/docker-compose.yml on an always-on host instead.
services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tacit-dev-password}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Throwaway database for the test suite (wiped by tests, nothing persisted).
  neo4j-test:
    image: neo4j:5.26
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/tacit-test-password
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p tacit-test-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  neo4jdata:
