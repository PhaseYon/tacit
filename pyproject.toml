[project]
name = "tacit"
version = "0.2.0"
description = "Your team's memory, wired into every AI tool: a local-first knowledge graph of Slack, GitHub and Notion, served to Claude and Cursor over MCP."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ahmed Fezan", email = "ahmedfezan58@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastembed>=0.9.1",
    "fastmcp>=4.1",
    "githubkit~=0.16.1",
    "graphiti-core[anthropic]==0.31.2",
    "keyring>=25",
    "langchain-text-splitters>=1.1.3",
    "neo4j>=5.28",
    "notion-client~=3.1",
    "openai>=3",
    "platformdirs>=4",
    "pydantic>=2.11",
    "pydantic-settings>=2.16.1",
    "slack-sdk~=3.45",
    "tiktoken>=0.14.0",
    "tomli-w>=1.2",
    "typer>=0.16",
    "wcmatch>=11.2",
]

[project.scripts]
tacit = "tacit.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["benchmark/bench_v0.py", "demo/load_v0.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j (docker compose up -d neo4j)"]
