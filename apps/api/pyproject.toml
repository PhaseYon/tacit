[project]
name = "tacit-api"
version = "0.1.0"
description = "Tacit API: auth-aware search, ingestion and MCP"
authors = [
    { name = "Ahmed Fezan", email = "ahmedfezan58@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "cryptography>=46",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "fastmcp>=4.1",
    "githubkit[auth-app]~=0.16.1",
    "graphiti-core[anthropic]==0.31.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "notion-client~=3.1",
    "openai>=3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "redis>=6.4.0",
    "slack-sdk~=3.45",
    "sqlalchemy[asyncio]>=2.1.6",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "wcmatch>=11.2",
]

[project.scripts]
tacit-api = "tacit_api.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# The formatter enforces line length for code; long SQL strings are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
