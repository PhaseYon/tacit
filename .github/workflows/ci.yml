name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tacit:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/tacit-test-password
        ports: ["7688:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p tacit-test-password 'RETURN 1'" --health-interval 10s --health-timeout 10s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
